name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint cần lịch sử để đọc các commit mới
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        # semantic-release tính phiên bản từ message, nên message sai chuẩn phải bị chặn trước khi lên main
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$SHA"
          else
            pnpm exec commitlint --last
          fi
      - name: Typecheck and build frontend
        # generate_context! của Tauri cần thư mục dist khi biên dịch
        run: pnpm --filter @zola-cleaner/desktop build
      - name: Typecheck and build landing page
        run: |
          pnpm --filter @zola-cleaner/site typecheck
          pnpm --filter @zola-cleaner/site build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
