name: Pages

# Build landing page (apps/site) và deploy lên GitHub Pages: https://holedev.github.io/zola-cleaner/
# Chạy lại khi đổi trang, ảnh chụp app, hoặc Verified Version trong lõi Rust (trang đọc nó lúc build).
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/desktop/app-icon.png"
      - "docs/screenshots/**"
      - "crates/core/src/layout.rs"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @zola-cleaner/site...
      - run: pnpm --filter @zola-cleaner/site build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
